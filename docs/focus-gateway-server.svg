<text x="420" y="522" font-size="13" font-weight="normal" text-anchor="middle" fill="#D97706">같은 키 쌍 (auth 개인키 · 여기 공개키)</text>
<text x="40" y="720" font-size="13" font-weight="normal" text-anchor="start" fill="#4B5563">바깥에서 들어온 X-User-Id 는 여기서 지워짐 · permit-all 9줄은 auth 와 같은 목록 · 401 · 403 · 404 · 503 을 직접 냄</text>
<text x="1476" y="748" font-size="11" text-anchor="end" fill="#9CA3AF">gateway-server 를 중심으로 · 직접 연결된 것만</text></svg>