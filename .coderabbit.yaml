# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: false
  poem: false
  review_status: true
  review_details: false
  path_filters:
    - "!**/build/**"
    - "!**/generated/**"
    - "!**/db/migration/**"
  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
